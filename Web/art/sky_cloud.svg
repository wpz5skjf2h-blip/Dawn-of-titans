<svg xmlns="http://www.w3.org/2000/svg" width="256" height="128" viewBox="0 0 256 128">
<!-- Dawn of Titans: a soft cumulus cloud for the sky over the battlefield (also tinted for distant smoke). -->
<defs>
<linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0.2" stop-color="#ffffff"/><stop offset="0.75" stop-color="#e6ecf2"/><stop offset="1" stop-color="#b8c4d2"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="5" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G" result="d"/>
<feGaussianBlur in="d" stdDeviation="3.2"/>
</filter>
</defs>
<g fill="url(#c)" filter="url(#soft)">
<ellipse cx="128" cy="92" rx="104" ry="20"/>
<circle cx="78" cy="78" r="28"/><circle cx="118" cy="58" r="38"/><circle cx="162" cy="66" r="32"/><circle cx="196" cy="84" r="22"/><circle cx="56" cy="90" r="18"/>
</g>
</svg>
