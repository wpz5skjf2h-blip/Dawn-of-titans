<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Dawn of Titans: wet river mud and gravel at fords and banks, tiles seamlessly. -->
<defs>
<filter id="patch" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
<feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="4" seed="31" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.31 0 0 0 0 0.3 0 0 0 0 0.22 3 0 0 0 -1.3"/>
</filter>
<filter id="gravel" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
<feTurbulence type="fractalNoise" baseFrequency="0.2" numOctaves="1" seed="12" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.7 0 0 0 0 0.68 0 0 0 0 0.6 0 0 10 0 -6.6"/>
</filter>
<filter id="sheen" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
<feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="40" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.62 0 0 0 0 0.66 0 0 0 0 0.62 0 6 0 0 -3.9"/>
</filter>
</defs>
<rect width="256" height="256" fill="#6a6448"/>
<rect width="256" height="256" filter="url(#patch)"/>
<rect width="256" height="256" filter="url(#sheen)"/>
<rect width="256" height="256" filter="url(#gravel)"/>
</svg>
