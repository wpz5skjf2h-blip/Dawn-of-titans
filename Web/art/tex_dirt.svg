<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Dawn of Titans: packed road dirt with pebbles, tiles seamlessly. -->
<defs>
<filter id="patch" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
<feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="4" seed="21" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.5 0 0 0 0 0.39 0 0 0 0 0.25 3 0 0 0 -1.35"/>
</filter>
<filter id="light" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
<feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="5" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.78 0 0 0 0 0.68 0 0 0 0 0.5 0 3 0 0 -1.5"/>
</filter>
<filter id="pebble" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
<feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="1" seed="9" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.76 0 0 0 0 0.7 0 0 0 0 0.58 0 0 12 0 -8.2"/>
</filter>
<filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="3" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.3 0 0 0 0 0.22 0 0 0 0 0.13 4.4 0 0 0 -2.5"/>
</filter>
</defs>
<rect width="256" height="256" fill="#a28a5e"/>
<rect width="256" height="256" filter="url(#patch)"/>
<rect width="256" height="256" filter="url(#light)"/>
<rect width="256" height="256" filter="url(#grain)"/>
<rect width="256" height="256" filter="url(#pebble)"/>
</svg>
