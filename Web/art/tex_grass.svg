<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Dawn of Titans: meadow grass, tiles seamlessly. Battle ground detail texture (one tile covers about 9 m). -->
<defs>
<filter id="patch" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
<feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="3" seed="4" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.5 0 0 0 0 0.6 0 0 0 0 0.26 2.4 0 0 0 -1.12"/>
</filter>
<filter id="dark" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="11" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.2 0 0 0 0 0.33 0 0 0 0 0.13 0 3.4 0 0 -1.6"/>
</filter>
<filter id="blades" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
<feTurbulence type="fractalNoise" baseFrequency="0.55 0.06" numOctaves="2" seed="7" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.47 0 0 0 0 0.63 0 0 0 0 0.25 3.6 0 0 0 -2.15"/>
</filter>
<filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
<feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="1" seed="2" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.16 0 0 0 0 0.24 0 0 0 0 0.09 0 0 5 0 -3.0"/>
</filter>
</defs>
<rect width="256" height="256" fill="#5a8531"/>
<rect width="256" height="256" filter="url(#patch)"/>
<rect width="256" height="256" filter="url(#dark)"/>
<rect width="256" height="256" filter="url(#blades)"/>
<rect width="256" height="256" filter="url(#grain)"/>
</svg>
