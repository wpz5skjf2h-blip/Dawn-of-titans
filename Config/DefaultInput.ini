[/Script/Engine.InputSettings]
; The prototype polls mouse, keyboard and touch directly in ADoTPlayerController (no input assets needed).
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent
; No virtual joysticks on mobile: the battle uses tap / drag / pinch gestures.
DefaultTouchInterface=None
bAlwaysShowTouchInterface=False
bUseMouseForTouch=False
bEnableMouseSmoothing=False
bCaptureMouseOnLaunch=False
DefaultViewportMouseCaptureMode=CaptureDuringMouseDown
